[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-sentinel"
version = "1.0.0"
requires-python = ">=3.11"
description = "Intelligent Cyber Threat and Network Anomaly Detection Sentinel"
readme = "README.md"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pandas==2.2.2",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "joblib==1.4.2",
    "sqlalchemy==2.0.30",
    "streamlit==1.35.0",
    "plotly==5.22.0",
    "typer==0.12.3",
    "PyYAML==6.0.1",
    "python-dotenv==1.0.1",
    "rich==13.7.1",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cyber-sentinel = "cyber_sentinel.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
